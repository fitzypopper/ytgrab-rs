[package]
name = "ytgrab"
version = "0.1.0"
edition = "2021"
description = "A fast YouTube downloader written in Rust. Speaks the InnerTube API directly: no browser, no HTML scraping, no JS engine."
license = "MIT"
readme = "README.md"
repository = "https://github.com/fitzypopper/ytgrab-rs"
keywords = ["youtube", "downloader", "innertube", "cli"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
    "gzip",
    "brotli",
    "charset",
    "http2",
    "cookies",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
indicatif = "0.18"
quick-xml = "0.37"
chrono = "0.4"
dirs = "6"
url = "2"
percent-encoding = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

# Browser cookie extraction
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
rquickjs = "0.14"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
